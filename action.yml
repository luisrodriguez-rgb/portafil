name: Portafil
description: Your contribution graph as an animated SVG for your GitHub profile - AI snake, Pac-Man, Tetris, invaders or Game of Life.
author: Luis Rodriguez
branding:
  icon: grid
  color: gray-dark

inputs:
  github_user_name:
    description: GitHub username whose contribution graph is animated.
    required: true
  outputs:
    description: |
      One .svg path per line, with options as a query string. Example:
        dist/portafil-snake.svg?theme=paper
        dist/portafil-snake-dark.svg?theme=ink&speed=fast
        dist/portafil-pacman.svg?game=pacman&theme=cyberpunk
      Options: game (snake, life, pacman, invaders, tetris), theme (ink, paper, dark, light, cyberpunk, neon_cyan, amber_terminal),
      lang (en, es), mood (auto, off) and, for the snake, speed (normal, fast, relaxed), morph (matrix_viper, capsule, retro), pause (fast, medium, none).
    required: true
  github_token:
    description: Token to read the calendar with the official GraphQL API. Empty = public third-party API.
    required: false
    default: ${{ github.token }}

runs:
  using: node24
  main: action/index.js
