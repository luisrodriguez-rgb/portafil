name: Perfila snake
description: Genera el SVG animado de Perfila, una serpiente con IA (BFS + Flood Fill) que se come tu gráfico de contribuciones.
author: Perfila
branding:
  icon: grid
  color: gray-dark

inputs:
  github_user_name:
    description: Usuario de GitHub cuyo grafico de contribuciones se anima.
    required: true
  outputs:
    description: |
      Una ruta .svg por linea, con opciones en formato query string. Ejemplo:
        dist/perfila-snake.svg?theme=paper
        dist/perfila-snake-dark.svg?theme=ink&speed=fast
      Opciones: theme (ink, paper, dark, light, cyberpunk, neon_cyan, amber_terminal),
      speed (normal, fast, relaxed), morph (matrix_viper, capsule, retro), pause (fast, medium, none), lang (en, es).
    required: true
  github_token:
    description: Token para leer el calendario con la API GraphQL oficial. Vacio = API publica de terceros.
    required: false
    default: ${{ github.token }}

runs:
  using: node24
  main: action/index.js
