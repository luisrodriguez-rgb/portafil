<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 797 96" width="797" height="96" role="img"><title>@luisrodriguez-rgb companion (Dev fantasma) by Portafil</title><style>text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.zx,.zy{transform-box:fill-box;animation:zx .9s cubic-bezier(.2,.7,.2,1) both}.zx{transform-origin:left}.zy{transform-origin:bottom;animation-name:zy}.zf{animation:zf .6s ease-out both}@keyframes zx{from{transform:scaleX(0)}}@keyframes zy{from{transform:scaleY(0)}}@keyframes zf{from{opacity:0}}@media (prefers-reduced-motion:reduce){.zx,.zy,.zf{animation:none}}.zcs{image-rendering:-moz-crisp-edges;image-rendering:pixelated;animation:zcs 0.6s steps(6) infinite}.zcp{animation:zcp 14s linear infinite}@keyframes zcs{from{transform:translateX(0)}to{transform:translateX(-336px)}}@keyframes zcp{0%{transform:translateX(28px) scaleX(1)}48%{transform:translateX(713px) scaleX(1)}50%{transform:translateX(713px) scaleX(-1)}98%{transform:translateX(28px) scaleX(-1)}100%{transform:translateX(28px) scaleX(1)}}@media (prefers-reduced-motion:reduce){.zcs,.zcp{animation:none}}</style><rect x=".5" y=".5" width="796" height="95" rx="11.5" fill="#040806" stroke="rgba(0, 255, 102, 0.15)"/><text x="16" y="26" font-size="12" font-weight="700" fill="#e6fff2">Dev fantasma<tspan fill="#8fb8a2" font-weight="400"> · Vigilando los commits y desplegando sin miedo</tspan></text><text x="781" y="26" font-size="11" text-anchor="end" fill="#8fb8a2">● EN PATRULLA</text><defs><clipPath id="zcd"><rect x="-28" y="0" width="56" height="56"/></clipPath></defs><line x1="24" y1="82" x2="773" y2="82" stroke="#096831" stroke-width="1.5" stroke-dasharray="6 6"/><circle cx="24" cy="82" r="3" fill="#00ff66"/><circle cx="773" cy="82" r="3" fill="#00ff66"/><g transform="translate(0 28)"><g class="zcp"><g clip-path="url(#zcd)"><g transform="translate(-28 -56)"><image class="zcs" href="data:image/png;base64," width="336" height="336"/></g></g></g></g></svg>