<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 96" width="390" height="96" role="img"><title>@luisrodriguez-rgb companion (Cyber Ninja) by Portafil</title><style>text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.zx,.zy{transform-box:fill-box;animation:zx .9s cubic-bezier(.2,.7,.2,1) both}.zx{transform-origin:left}.zy{transform-origin:bottom;animation-name:zy}.zf{animation:zf .6s ease-out both}@keyframes zx{from{transform:scaleX(0)}}@keyframes zy{from{transform:scaleY(0)}}@keyframes zf{from{opacity:0}}@media (prefers-reduced-motion:reduce){.zx,.zy,.zf{animation:none}}.zcs{image-rendering:-moz-crisp-edges;image-rendering:pixelated;animation:zcs 0.67s steps(4) infinite}@keyframes zcs{from{transform:translateX(0)}to{transform:translateX(-192px)}}@media (prefers-reduced-motion:reduce){.zcs{animation:none}}</style><rect x=".5" y=".5" width="389" height="95" rx="11.5" fill="#090614" stroke="rgba(255, 0, 127, 0.25)"/><text x="16" y="26" font-size="12" font-weight="700" fill="#ffd6f5">Cyber Ninja<tspan fill="#b58ab0" font-weight="400"> · anime</tspan></text><text x="374" y="26" font-size="11" text-anchor="end" fill="#b58ab0">● MODO FOCO</text><defs><clipPath id="zcb"><rect x="0" y="0" width="48" height="48" rx="6"/></clipPath></defs><rect x="16" y="36" width="52" height="48" rx="8" fill="#170d2b" stroke="rgba(255, 0, 127, 0.25)"/><g transform="translate(18 36)" clip-path="url(#zcb)"><g transform="translate(0 -192)"><image class="zcs" href="data:image/png;base64," width="288" height="288"/></g></g><text x="80" y="56" font-size="12" fill="#ffd6f5">“Silencio absoluto. Katana envainada</text><text x="80" y="72" font-size="12" fill="#ffd6f5">y código certero.”</text></svg>